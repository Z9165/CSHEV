name: collect-downloads

# הרצה רציפה: כל הרצה דוגמת את מוני ההורדות כל 3 דקות במשך כ-5.5 שעות,
# ובסופה מפעילה את עצמה מחדש. ה-cron הוא גיבוי למקרה שהשרשרת נקטעה.
# לעצירה: Actions -> collect-downloads -> ... -> Disable workflow.
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Poll
        run: python collect.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_USER: Zvi-Dorsz-Zion
          LOOP_MINUTES: "335"
          INTERVAL_SECONDS: "180"
          CI_COMMIT: "1"
      - name: Start next run
        if: ${{ !cancelled() }}
        run: |
          sleep 15
          gh workflow run collect.yml --ref "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
