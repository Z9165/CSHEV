name: collect-downloads

on:
  schedule:
    - cron: "7 * * * *"   # כל שעה בדקה 7 (פחות עומס מאשר בדקה 0)
  workflow_dispatch:       # הרצה ידנית מלשונית Actions

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        id: collect
        run: python collect.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_USER: Zvi-Dorsz-Zion
      - name: Report
        if: steps.collect.outputs.changed == 'true'
        run: python report.py
      - name: Commit
        if: steps.collect.outputs.changed == 'true'
        run: |
          git config user.name "downloads-bot"
          git config user.email "downloads-bot@users.noreply.github.com"
          git add data REPORT.md
          git commit -m "update downloads" && git push
